{% extends "/admin/admin_base.html" %}
{% block title %}Edit Donor{% endblock %}

{% block content %}
<style>
    /* Background Image */
    body {
        background-color: rgba(233, 9, 9, 0.397);
    }
</style>
<div class="container my-4">

    <form method="POST" class="col-lg-6 col-sm-10 mx-auto p-4 border border-dark rounded-4 border-5 rounded bg-light">
        <h3 class="text-center border border-dark border-3 p-2 rounded">EDIT CAMPAIGN</h3>
        <div class="mb-3">
            <label>Full Name</label>
            <input type="text" name="full_name"
                   value="{{ donor[1] }}"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Gender</label>
            <select name="gender" class="form-select" required>
                {% for g in ['Male','Female','Other'] %}
                <option value="{{ g }}" {% if donor[2]==g %}selected{% endif %}>
                    {{ g }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label>Age</label>
            <input type="number" name="age"
                   value="{{ donor[3] }}"
                   class="form-control" required>
        </div>

        <!-- BLOOD GROUP (READ ONLY) -->
        <div class="mb-3">
            <label>Blood Group</label>
            <input type="text"
                   class="form-control fw-bold text-danger"
                   value="{{ donor[4] }}"
                   readonly>
        </div>

        <div class="mb-3">
            <label>Phone</label>
            <input type="text" name="phone"
                   value="{{ donor[5] }}"
                   class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email"
                   value="{{ donor[6] }}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label>Address</label>
            <textarea name="address"
                      class="form-control">{{ donor[7] }}</textarea>
        </div>

        <div class="text-center">
            <button class="btn btn-success">Update</button>
            <a href="{{ url_for('admin_bp.admin_manage_donors') }}"
               class="btn btn-danger">Cancel</a>
        </div>

    </form>

</div>
{% endblock %}
