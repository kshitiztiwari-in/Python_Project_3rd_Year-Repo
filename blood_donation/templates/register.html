{% extends "base.html" %}

{% block title %}Register | Blood Donation{% endblock %}

{% block content %}

<style>
  /* Background Image */
  body {
    background: url("{{ url_for('static', filename='images/BgRegisiterFinal.png') }}") no-repeat center center fixed;
    background-size: cover;
  }
</style>
<div class="container ">
  <h2 class="text-center my-4 text-light fs-1">Become A Lifesaver Today</h2>
</div>
<div class="container my-4 pb-5">
  <form class="row g-3 m-2 p-3 mb-5 col-lg-5 col-sm-10 mx-auto form-box border-dark border-5 rounded-4"
    action="{{ url_for('home_bp.register') }}" method="POST">

    <h3 class="text-center border border-dark border-3 p-2 rounded">Register Now</h3>

    <div class="col-12">
      <label class="form-label">Full Name</label>
      <input type="text" name="full_name" class="form-control border-secondary" required>
    </div>

    <div class="col-12">
      <label class="form-label">Email</label>
      <input type="email" name="email" class="form-control border-secondary" required>
    </div>

    <div class="col-12">
      <label class="form-label">Address</label>
      <input type="text" name="address" class="form-control border-secondary">
    </div>

    <div class="col-md-6">
      <label class="form-label">Age</label>
      <input type="number" name="age" class="form-control border-secondary" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Gender</label>
      <select name="gender" class="form-select border-secondary" required>
        <option selected disabled>Choose...</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>

    <div class="col-md-6">
      <label class="form-label">Phone Number</label>
      <input type="text" name="phone" class="form-control border-secondary" required>
    </div>

    <div class="col-md-6">
      <label class="form-label">Blood Group</label>
      <select name="blood_group" class="form-select border-secondary" required>
        <option selected disabled>Choose...</option>
        <option>A+</option>
        <option>A-</option>
        <option>B+</option>
        <option>B-</option>
        <option>AB+</option>
        <option>AB-</option>
        <option>O+</option>
        <option>O-</option>
      </select>
    </div>

    <div class="col-12">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control border-secondary" required>
    </div>
    <div class="text-center">
                <p>Already Registered ? <a href="{{url_for('home_bp.login')}}">Login Now</a></p>
            </div>
    <div class="d-grid col-4 mx-auto">
      <button type="submit" class="btn btn-danger">Register</button>
    </div>

  </form>

</div>

{% endblock %}
